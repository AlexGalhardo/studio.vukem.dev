# The authenticated app at https://app.studio.vukem.dev. Point the Railway
# service at this file (Settings, Config-as-code, /railway.app.toml).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.app"

[deploy]
# The SQLite file lives on the volume at /app/storage, which a pre-deploy container never mounts, so the start
# command migrates once the volume is there and then execs the server.
startCommand = "/bin/sh -c \"/app/app migrate && exec /app/app\""
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

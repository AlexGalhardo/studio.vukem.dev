# The authenticated app at https://app.studio.vukem.dev. Railway only reads the root railway.toml, so these are
# the values to set on the `studio-app` service (and RAILWAY_DOCKERFILE_PATH=Dockerfile.app as a variable).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.app"

[deploy]
# The SQLite file lives on the volume at /app/storage, which a pre-deploy container never mounts, so the start
# command migrates once the volume is there and then execs the server. Railway volumes are owned by root, so
# the service sets RAILWAY_RUN_UID=0 and the command hands /app/storage to uid 10001, then drops to `app`.
startCommand = "/bin/sh -c \"chown 10001:10001 /app/storage && find /app/storage -xdev ! -user 10001 -exec chown -h 10001:10001 {} + && exec su app -s /bin/sh -c '/app/app migrate && exec /app/app'\""
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

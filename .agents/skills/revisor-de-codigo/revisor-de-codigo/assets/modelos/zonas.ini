# MODELO de configuração do escopo.py. Copie para a raiz do repositório com o nome .revisor.ini
# (o script lê sozinho) ou passe com --config <arquivo>. Declare só o que foge do padrão embutido.
#
# Padrão sem barra casa com o nome do arquivo em qualquer pasta. Com barra, casa com o caminho
# desde a raiz, e ** atravessa pastas. Maiúsculas e minúsculas não fazem diferença.
# Zona declarada aqui vem antes das embutidas, na ordem do arquivo; mesmo nome substitui a
# embutida. Zonas embutidas: segredo, documentacao, banco, pagamento, acesso, testes,
# implantacao, interface. O que não casa com nenhuma vai para "outros".

[zonas]
# As pastas deste projeto que guardam cobrança e permissão com outros nomes.
pagamento = **/cobranca/**, **/faturas/**, *fatura*, *recibo*
acesso = **/contas/**, **/papeis/**, *permiss*
# Uma zona nova: o que monta resposta em cache compartilhado.
cache = **/cache/**, *cache*

[lentes]
# Lentes de cada zona declarada. Sem linha aqui, a zona nova pede "comportamento" e a que tem
# nome de embutida mantém as lentes da embutida.
# Lentes do método: banco-e-implantacao, seguranca-e-fronteiras, comportamento, testes.
# Outro nome vale como lente extra e aparece em "lentes pedidas".
cache = seguranca-e-fronteiras, comportamento

; Exemplo de um projeto fictício (Quadra Livre). Nada aqui é instrução para o projeto atual.
; Os comandos são de Python: stack escolhida para este produto fictício; não é recomendação.

[documentos]
especificacao = ESPECIFICACAO.md
instrucoes = INSTRUCOES.md
decisoes = docs/decisoes.md
roteiro = docs/ROTEIRO.md
estado = docs/ESTADO.md
leiame = README.md
planos = docs/planos
notas = docs/notas
; Abaixo do padrão de 8000: o arquivo de instruções deste projeto é pequeno, e o teto o mantém.
orcamento_instrucoes = 6000

[escada]
0.nome = formato e lint
0.comando = ruff format --check . && ruff check .
1.nome = tipos
1.comando = mypy quadra contas socios reservas
2.nome = unidade e fronteiras
2.comando = pytest -q --ignore=reservas/tests && python3 ferramentas/metodo/fronteiras.py
3.nome = banco
; Os testes de permissão por persona e de vazamento rodam aqui, pelo cliente de teste.
3.comando = pytest -q reservas/tests
3.precisa = PostgreSQL do ambiente local no ar; os testes criam e apagam um banco próprio
4.nome = build
4.comando = n/a: sem etapa de build
5.nome = ponta a ponta
; Vazio: pendente. O degrau está em "Ficou para depois", em docs/ESTADO.md, com data.
5.comando =

[zonas]
dados.degrau = 3
dados.caminhos = reservas/migrations/**
acesso.degrau = 5
acesso.caminhos = contas/**, reservas/permissoes.py
segredos.degrau = 2
segredos.caminhos = quadra/segredos.py
restrito.degrau = 5
restrito.caminhos = socios/contato.py, socios/tesouraria.py
; As zonas cache e cobranca foram apagadas: o produto não tem cache compartilhado, e a cobrança
; entra na Fase 3, que traz a zona de volta.

[envio]
ramo_que_implanta = main
base =
nunca_enviar = .env, .env.*, !.env.example, *.pem, *.key
excecoes_de_segredo =

[decisoes]
prefixo = ADR-

[fronteiras]
pastas = reservas, contas, socios
extensoes = .py
ignorar = **/tests/**, **/migrations/**
minimo_de_arquivos = 10
arquivo_conhecido = socios/contato.py

[fronteira.contato-so-pela-porta]
tipo = nome-restrito
padrao = ContatoDoSocio
permitidos = socios/contato.py
motivo = o telefone do sócio só sai pela porta de leitura, que começa pela guarda (ADR-002)

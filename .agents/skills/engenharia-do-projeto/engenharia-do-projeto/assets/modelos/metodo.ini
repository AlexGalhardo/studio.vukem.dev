; MODELO. Nada aqui vale como instrução enquanto não for preenchido e gravado no projeto.
; Onde estão os documentos e como este projeto se verifica. Contém comandos: é código do projeto
; e passa por revisão. Comentário, só em linha própria. Lista se separa por vírgula. Em caminho,
; "*" não atravessa "/", "**" atravessa, e padrão sem "/" vale em qualquer pasta.

[documentos]
; O caminho de cada documento, na forma exata "chave = valor". Aponte para o arquivo que já
; cumpre o papel, sem renomear nada. Exemplo: roteiro = docs/plano.md
especificacao = ESPECIFICACAO.md
instrucoes = CLAUDE.md
; Pode ser uma pasta, com um arquivo por registro. Exemplo: decisoes = docs/adr
decisoes = docs/decisoes.md
roteiro = docs/ROTEIRO.md
estado = docs/ESTADO.md
leiame = README.md
; Pastas dos planos e das notas de memória: nascem com o primeiro plano e a primeira nota.
planos = docs/planos
notas = docs/notas
; Teto do arquivo de instruções, em caracteres. O diagnóstico acusa quando ele passa.
orcamento_instrucoes = 8000

[escada]
; Um degrau por verificação, do barato ao caro. N.comando roda no shell, na raiz do projeto.
; Vazio: pendente. "n/a: <motivo>": não existe nesta stack, e conta como subido. Grave o comando
; depois de rodá-lo uma vez. Exemplo: 0.comando = <o comando de lint do projeto>. Script do método
; só se cita pela cópia do projeto (python3 ferramentas/metodo/fronteiras.py): o caminho da skill
; não existe em outra máquina nem no CI. Opcionais: N.precisa (só informa), N.limite (segundos).
0.nome = formato e lint
0.comando =
1.nome = tipos
1.comando =
2.nome = unidade e fronteiras
2.comando =
3.nome = banco
3.comando =
4.nome = build
4.comando =
5.nome = ponta a ponta
5.comando =

[zonas]
; Mudança que toca um destes caminhos pesa no mínimo médio e sobe até o degrau da zona. Zona sem
; caminhos não casa com nada: a classificação por caminho fica desligada para ela. Zona que o
; projeto não tem: apague as duas linhas. Zona nova: outro par. Exemplo: dados.caminhos = db/**
dados.degrau = 3
dados.caminhos =
acesso.degrau = 5
acesso.caminhos =
; O módulo que lê os segredos, não os arquivos de ambiente: estes o git ignora.
segredos.degrau = 2
segredos.caminhos =
restrito.degrau = 5
restrito.caminhos =
cache.degrau = 4
cache.caminhos =
cobranca.degrau = 5
cobranca.caminhos =

[envio]
; O ramo cujo envio implanta: enviar para ele é ir a produção. Exemplo: ramo_que_implanta = main
ramo_que_implanta =
; Com o que comparar o que está a enviar. Vazio: o ramo remoto de acompanhamento.
base =
; O que não sai em envio nenhum. "!" na frente reinclui, e só vale nesta chave.
nunca_enviar = .env, .env.*, !.env.example, *.pem, *.key
; Onde valor com cara de segredo é esperado. Exemplo: excecoes_de_segredo = testes/falsos/**
excecoes_de_segredo =

[decisoes]
; Prefixo do número dos registros, como aparece nos títulos e nas citações.
prefixo = ADR-

[fronteiras]
; O que fronteiras.py lê. Exemplo: pastas = src, app; extensoes = .py, .sql; ignorar = **/testes/**
pastas =
extensoes =
ignorar =
; Contra regra verde sem ler nada: o mínimo de arquivos da varredura e um que tem de estar nela.
minimo_de_arquivos = 1
arquivo_conhecido =
; Regras: uma seção por regra, com motivo. Antes da primeira, rode montar.py --com-ferramentas
; e ponha python3 ferramentas/metodo/fronteiras.py no comando do degrau 2.
; [fronteira.segredo-em-um-modulo]
; tipo = nome-restrito
; padrao = CHAVE_DO_SERVICO
; permitidos = src/segredos.*
; motivo = o segredo é lido em um módulo só; cada leitura a mais é um lugar por onde ele vaza
; [fronteira.marcador-fora-dos-dados-de-exemplo]
; tipo = texto-proibido
; padrao = APP-SEED-
; exceto = banco/dados-de-exemplo/**, **/testes/**
; motivo = marcador no código do produto é dado de exemplo a caminho de produção

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Pedido: estilo "low-poly explicativo" (5 refs "COMO FUNCIONA · X": maquete 3D de massinha, HUD, legenda karaokê, corte e explosão).
     Tema: como funciona uma usina hidrelétrica — represa → queda no conduto → turbina gira o gerador → linhas → cidade acende. -->
<script>VIDEO={w:1080,h:1920,fps:60,dur:11,bpm:100,music:{style:'ambient_major',key:'D',gain:-4}}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#0c0f15;overflow:hidden} .layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as LP from '../../lib/lowpoly.js';
const { THREE, PAL, lerp, clamp, suave, fase } = LP;

// ── tempos (s) ──
const T = { c1: 0, c2: 2.7, corte: [2.7, 3.4], agua: 3.25, c3: 5.3, explode: [6.25, 6.95], energia: 6.9, c4: 8.0, luzes: [8.75, 10.15], carimbo: 9.75, fim: 11 };

const S = LP.palco({ fundo: ['#151a24', '#1c212b', '#0b0d12'], exposicao: 1, dof: { abertura: .018, max: 34 }, bloom: { forca: .42, raio: .5, limiar: .92 }, grao: .03, vinheta: .38 });
const cena = S.scene;

// ════════ maquete: vale com represa ════════
const rioX = z => z < 4 ? 0 : 1.7 * Math.sin((z - 4) * .2);
function H(x, z) {
  const garg = suave(-3.2, -.6, z) * (1 - suave(3.6, 6.5, z));            // 1 no desfiladeiro da barragem
  const L = lerp(z < 0 ? 6 : 4.6 + Math.max(0, z - 4) * .45, 4.5, garg);
  const W = lerp(3.4, 1.0, garg), A = z < 4 ? 5.6 : lerp(5.6, 1.5, suave(4, 13, z));
  let h = A * suave(L, L + W, Math.abs(x)) * (.85 + .3 * LP.fbm(x * .25 + 3, z * .25));
  h += z < -.3 ? .9 : .5;
  if (z > 2) h -= .55 * Math.exp(-(((x - rioX(z)) / 1.0) ** 2)) * suave(2.5, 4.5, z);
  return h + .12 * LP.fbm(x * .7, z * .7);
}
const corChao = (x, y, z, inc) => {
  if (inc > .55) return y > 3 ? PAL.rocha : '#a08f7a';
  if (z < 0 && y < 3.9) return '#c2ab86';                                  // margem do lago
  const n = LP.fbm(x * .5 + 9, z * .5);
  return n > .15 ? PAL.grama3 : n < -.15 ? PAL.grama2 : PAL.grama;
};
const ilha = LP.terreno({ x: [-10, 10], z: [-12, 22], seg: [44, 76], altura: H, cor: corChao, base: -1.6, corSaia: '#8a6649' });
cena.add(ilha);

const lago = LP.agua({ x: [-9.3, 9.3], z: [-11.95, -.02], nivel: 3.7, fundo: .5, onda: .05 }); cena.add(lago);
const rioCurva = new THREE.CatmullRomCurve3([[0, .22, 5.2], [0, .22, 6.5], ...[8, 10, 12, 14, 16, 18, 20, 22].map(z => [rioX(z), .22, z])].map(p => new THREE.Vector3(...p)));
const rio = LP.rio(rioCurva, { largura: 1.3 }); cena.add(rio);

// barragem: perfil trapezoidal extrudado (seção vertical z × y) ao longo de x
const perfil = new THREE.Shape([[0, 0], [3.0, 0], [.9, 4.3], [0, 4.3]].map(p => new THREE.Vector2(...p)));
const gBar = new THREE.ExtrudeGeometry(perfil, { depth: 11.2, bevelEnabled: false }); gBar.rotateY(-Math.PI / 2); gBar.translate(5.6, 0, 0);
const barragem = new THREE.Group();
barragem.add(LP.malha(gBar, LP.mat(PAL.branco)));
barragem.add(LP.caixa(11.2, .14, 1.05, PAL.gelo, { pos: [0, 4.3, .45], chanfro: .03 }));
for (let i = -4; i <= 4; i++) barragem.add(LP.caixa(.12, .22, .12, PAL.cinza, { pos: [i * 1.1, 4.44, .02], chanfro: .02 }));       // guarda-corpo
cena.add(barragem);

// conduto forçado: da tomada d'água (face de montante) até a turbina na casa de força
const conduto = new THREE.CatmullRomCurve3([[0, 2.55, -.35], [0, 2.3, .6], [0, 1.3, 1.8], [0, .72, 2.9], [0, .62, 4.1]].map(p => new THREE.Vector3(...p)));
const cano = LP.cano(conduto, { raio: .32, cor: PAL.grafite }); cena.add(cano);
const tomada = LP.caixa(1.1, 1.0, .22, PAL.grafite, { pos: [0, 2.05, -.12], chanfro: .04 }); cena.add(tomada);

// casa de força + subestação
const casa = new THREE.Group();
casa.add(LP.caixa(3.6, 2.0, 2.2, PAL.branco, { pos: [0, 0, 4.1], chanfro: .06, plano: true }));
casa.add(LP.caixa(3.8, .16, 2.4, PAL.cinza, { pos: [0, 2.0, 4.1], chanfro: .04 }));
for (let i = -1; i <= 1; i++) casa.add(LP.caixa(.7, .5, .05, '#2b3038', { pos: [i * 1.05, 1.15, 5.21], chanfro: 0 }));
cena.add(casa);
const turbMini = LP.turbina({ r: .42 }); turbMini.position.set(0, .3, 4.1); cena.add(turbMini);
const gerMini = LP.gerador({ r: .55 }); gerMini.position.set(0, .95, 4.1); cena.add(gerMini);
const eixoMini = LP.cilindro(.05, .9, PAL.cinza, { pos: [0, .6, 4.1] }); cena.add(eixoMini);
const sub = new THREE.Group();
sub.add(LP.caixa(1.8, .12, 1.4, PAL.gelo, { pos: [3.3, H(3.3, 5.2) - .02, 5.2], chanfro: .02 }));
for (let i = 0; i < 3; i++) sub.add(LP.caixa(.35, .55, .45, PAL.cinza, { pos: [2.75 + i * .55, H(3.3, 5.2) + .1, 5.2], chanfro: .05 }));
cena.add(sub);

// linhas de transmissão: subestação → 3 torres → entrada da cidade
const torresPos = [[4.7, 7.6], [5.5, 10.9], [5.1, 14.2]];
const torres = torresPos.map(([x, z], i) => { const tw = LP.torre({ h: 2.7 }); tw.position.set(x, H(x, z) - .05, z); tw.rotation.y = .12 * (i - 1); cena.add(tw); tw.updateMatrixWorld(true); return tw; });
const pontaMundo = (tw, k) => tw.userData.pontas[k].clone().applyMatrix4(tw.matrixWorld);
const ini = [new THREE.Vector3(2.75, H(3.3, 5.2) + .62, 5.2), new THREE.Vector3(3.85, H(3.3, 5.2) + .62, 5.2), new THREE.Vector3(3.3, H(3.3, 5.2) + .62, 5.2), new THREE.Vector3(3.3, H(3.3, 5.2) + .62, 5.2)];
const entradaCidade = new THREE.Vector3(4.3, H(4.3, 16.4) + .9, 16.4);
const fios = [0, 1, 2, 3].map(k => {
  const pts = [ini[k], ...torres.map(tw => pontaMundo(tw, k)), entradaCidade.clone().add(new THREE.Vector3((k - 1.5) * .25, 0, 0))];
  const path = new THREE.CurvePath(); for (let i = 0; i < pts.length - 1; i++) path.add(LP.catenaria(pts[i], pts[i + 1], .22));
  cena.add(LP.cabo(path, { seg: 90 })); return path;
});
const pulsos = [0, 1].map(k => { const f = LP.fluxo(fios[k], { n: 14, tam: .16, cor: PAL.amarelo, forca: 3.2, vel: .42, seed: 20 + k }); cena.add(f); return f; });

// cidade
const lotes = []; { const r = LP.rng(42);
  for (let z = 15.6; z < 21.4; z += 1.25) for (let x = -8.4; x < 8.5; x += 1.3) {
    const jx = x + (r() - .5) * .3, jz = z + (r() - .5) * .3; if (Math.abs(jx - rioX(jz)) < 1.55 || r() < .12) continue;
    const centro = 1 - Math.min(1, Math.hypot(jx - 1, jz - 18.5) / 9);
    lotes.push({ x: jx, z: jz, y: H(jx, jz) - .12, w: .75 + r() * .35, d: .7 + r() * .35, andares: 2 + Math.floor(r() * 2 + centro * 6 * r() + centro * 2), cor: [PAL.branco, PAL.gelo, PAL.branco, '#dfe3ea'][Math.floor(r() * 4)], ry: (r() - .5) * .1 });
  } }
const cid = LP.cidade({ lotes, acesa: '#ffcf73', forca: 1.9 }); cena.add(cid);
const ordemLuz = j => j.mundo.distanceTo(entradaCidade) / 14 + ((j.k * 7.3) % 1) * .25;

// árvores
const arvores = LP.floresta({ n: 120, seed: 9, h: .85, pinheiros: .3, chao: H,
  area: r => [(r() - .5) * 19.4, -11.6 + r() * 33],
  filtro: (x, z) => { const h = H(x, z); if (z < .2 && h < 3.95) return false; if (z > -.6 && z < 5.6 && Math.abs(x) < 5) return false; if (z > 14.8 && Math.abs(x) < 8.8) return false; if (Math.abs(x - rioX(z)) < 1.2 && z > 4) return false; if (Math.hypot(x - 3.3, z - 5.2) < 1.4) return false; return !torresPos.some(([tx, tz]) => Math.hypot(x - tx, z - tz) < .9); } });
cena.add(arvores);

const setasLago = [-3.2, -1.1, 1.1, 3.2].map((x, i) => { const c = new THREE.CatmullRomCurve3([[x * 1.6, 3.8, -10.5], [x, 3.8, -5.5], [x * .25, 3.8, -1.2]].map(p => new THREE.Vector3(...p))); const f = LP.fluxo(c, { n: 4, forma: 'seta', tam: .17, cor: '#cfe9ff', forca: .95, vel: .2, seed: 50 + i }); cena.add(f); return f; });
const poeira = LP.poeira({ n: 230, centro: [0, 7, 5], raio: [17, 7, 19], tam: .045 }); cena.add(poeira);

// vista em corte: plano em x (mantém x ≤ c). Tudo da maquete é cortado; a seção aparece chapada (terra em faixas, concreto, água)
const corte = LP.corte([-1, 0, 0], 100);
corte.aplicar(ilha, { secao: '#c48a5c', faixas: [[-.6, '#7d5a43'], [.4, '#a8744f'], [1.2, '#c48a5c']] });
corte.aplicar(barragem, { secao: '#c3cad4', hachura: ['#a7b0bc', .32] });
corte.aplicar(casa, { secao: '#c3cad4', hachura: ['#a7b0bc', .32] });
corte.aplicar(lago.userData.volume);
const secLago = LP.secaoAgua({ z: [-11.95, -.03], nivel: 3.7, fundo: .5, chao: H, cor: '#4b90d8' }); cena.add(secLago);
corte.aplicar(lago.userData.lamina); corte.aplicar(arvores); corte.aplicar(cano); corte.aplicar(tomada); corte.aplicar(rio); corte.aplicar(sub);
torres.forEach(tw => corte.aplicar(tw));
const aguaCano = LP.fluxo(conduto, { n: 30, forma: 'seta', tam: .17, cor: PAL.aguaClara, forca: 1.35, vel: .55, seed: 3 }); cena.add(aguaCano);
const saidaCurva = new THREE.CatmullRomCurve3([[0, .35, 4.4], [0, .3, 5.4], [rioX(7), .3, 7.2], [rioX(9.5), .3, 9.5]].map(p => new THREE.Vector3(...p)));
const aguaSai = LP.fluxo(saidaCurva, { n: 12, forma: 'seta', tam: .17, cor: PAL.aguaClara, forca: 1.35, vel: .45, seed: 4 }); cena.add(aguaSai);

// ════════ close: turbina + gerador explodidos (longe da maquete, no "vazio") ════════
const C3 = new THREE.Vector3(60, 0, 60);
const maq = new THREE.Group(); maq.position.copy(C3); cena.add(maq);
maq.add(LP.caixa(4.6, .3, 3.2, PAL.grafite, { pos: [0, -.3, 0], chanfro: .08 }));
const turb = LP.turbina({ r: 1.15 }); turb.position.y = .1; maq.add(turb);
const eixo = LP.cilindro(.13, 4.2, PAL.cinza, { lados: 10, pos: [0, .7, 0] }); maq.add(eixo);
const ger = LP.gerador({ r: 1.45 }); ger.position.y = 2.75; maq.add(ger);
const PG = ger.userData.partes;
const corteGer = LP.corte([0, 0, -1], C3.z); corteGer.aplicar(PG.estator, { secao: '#c3cad4', hachura: ['#a7b0bc', .22] });
LP.prepararExplosao(PG.tampa, [0, 1.45, 0]); LP.prepararExplosao(PG.estator, [0, .95, 0]);
// entrada d'água em espiral (cortada ao meio, de frente para a câmera)
const espiral = new THREE.CatmullRomCurve3([[5.2, .55, -.2], [3.2, .55, -.25], [1.95, .55, -.9], [.9, .55, -1.55], [-.6, .55, -1.5], [-1.55, .55, -.3], [-1.1, .55, .9], [0, .55, 1.25], [.85, .5, .7]].map(p => new THREE.Vector3(...p)));
const caixaEsp = LP.cano(espiral, { raio: .42, cor: PAL.gelo, interior: '#2a3039', seg: 90 }); maq.add(caixaEsp);
const corteEsp = LP.corte([0, -1, 0], C3.y + .55); corteEsp.aplicar(caixaEsp);
const aguaEsp = LP.fluxo(espiral, { n: 34, forma: 'seta', tam: .2, cor: PAL.aguaClara, forca: 1.35, vel: .5, seed: 8 }); maq.add(aguaEsp);
const cabSaida = new THREE.CatmullRomCurve3([[1.45, 3.05, 0], [2.6, 3.0, .2], [3.4, 2.2, .3], [4.2, 1.0, .3], [6.5, .8, .3]].map(p => new THREE.Vector3(...p)));
maq.add(LP.cabo(cabSaida, { raio: .05, seg: 40 }));
const pulsoSaida = LP.fluxo(cabSaida, { n: 9, tam: .2, cor: PAL.amarelo, forca: 3.2, vel: .6, seed: 31 }); maq.add(pulsoSaida);
const poeira3 = LP.poeira({ n: 110, centro: [60, 3, 58], raio: [8, 6, 6], tam: .04, seed: 77 }); cena.add(poeira3);

// ════════ câmera por capítulos ════════
const cam = LP.roteiroCamera(S, [
  { t0: T.c1, t1: T.c2, de: { pos: [-4.2, 17.5, -27.5], alvo: [0, 1.2, 2.5] }, ate: { pos: [-3.0, 14.6, -22.5], alvo: [0, 1.6, 2.2] }, ease: 'sine.out', fov: 40, foco: -6, abertura: .016, sombra: [0, 1, 4, 17] },
  { t0: T.c2, t1: T.c3, de: { pos: [19, 6.6, 3.6], alvo: [0, 2.0, 1.5] }, ate: { pos: [16.4, 5.4, 2.6], alvo: [0, 1.9, 1.5] }, ease: 'sine.inOut', fov: 42, foco: -.5, abertura: .017, sombra: [0, 1, 3, 10] },
  { t0: T.c3, t1: T.c4, de: { pos: [61.5, 2.9, 66.4], alvo: [60, .7, 60] }, ate: { pos: [62.7, 5.5, 76.6], alvo: [60, 2.95, 60] }, ease: 'power2.inOut', fov: 34, abertura: .018, sombra: [60, 2, 60, 6.5] },
  { t0: T.c4, t1: T.fim + 1, de: { pos: [14, 12.5, 1.5], alvo: [.8, 1, 13] }, ate: { pos: [17.5, 17.5, -2.5], alvo: [.8, 1, 13.5] }, arco: true, ease: 'sine.out', fov: 32, foco: 1.5, abertura: .014, sombra: [1, 1, 10, 16] },
]);

// ════════ animação ════════
S.update = t => {
  cam(t);
  lago.userData.update(t); rio.userData.update(t); poeira.userData.update(t); poeira3.userData.update(t);
  // corte: o plano varre de x=9 até x=0 no início do cap. 2; volta inteiro no cap. 4
  const kc = fase(t, T.corte[0], T.corte[1], 'power2.out');
  const cx = t < T.c2 || t >= T.c4 ? 100 : lerp(6.5, 0, kc); corte.pos(cx); secLago.userData.pos(cx);
  setasLago.forEach(f => { f.visible = t < T.c2; f.userData.update(t, fase(t, .3, 1.2)); });
  aguaCano.visible = aguaSai.visible = t >= T.c2 && t < T.c3;
  const qa = fase(t, T.agua, T.agua + .6);
  aguaCano.userData.update(t, qa); aguaSai.userData.update(t, fase(t, T.agua + .5, T.agua + 1.1));
  // cap. 3: água gira a turbina, que gira o rotor; estator e tampa sobem (vista explodida); bobinas acendem
  const k3 = t - T.c3, vel = 5.5 * fase(t, T.c3 + .1, T.c3 + 1.4, 'power2.in');
  const ang = t < T.c3 ? 0 : 5.5 * Math.max(0, k3 - .75) + 5.5 * .3 * Math.min(k3, .75) ** 2 / .75 * .6;
  turb.rotation.y = PG.rotor.rotation.y = eixo.rotation.y = -ang; void vel;
  turbMini.rotation.y = gerMini.userData.partes.rotor.rotation.y = -t * 4;
  aguaEsp.userData.update(t, fase(t, T.c3, T.c3 + .5));
  LP.explodir([PG.tampa, PG.estator], fase(t, T.explode[0], T.explode[1], 'back.inOut(1.4)'));
  const ke = fase(t, T.energia, T.energia + .4);
  PG.estator.userData.bobinas.forEach((b, i) => { const a = i / 12 * Math.PI * 2; b.material.emissiveIntensity = ke * (.35 + 2.4 * Math.max(0, Math.cos(8 / 2 * (a - ang))) ** 6); });
  pulsoSaida.visible = t >= T.energia; pulsoSaida.userData.update(t, fase(t, T.energia, T.energia + .5));
  // cap. 4: energia nos fios, cidade acende, luz do estúdio baixa um pouco
  const k4 = fase(t, T.c4 + .1, T.c4 + 1.4, 'power1.inOut');
  S.sol.intensity = lerp(2.4, 1.55, k4); S.hemi.intensity = lerp(1.5, .95, k4);
  pulsos.forEach(p => { p.visible = t >= T.c4; p.userData.update(t, fase(t, T.c4 + .15, T.c4 + .9)); });
  const kl = (t - T.luzes[0]) / (T.luzes[1] - T.luzes[0]);
  cid.userData.acender(j => clamp((kl - ordemLuz(j)) * 9));
};

// ════════ HUD ════════
LP.cabecalho(S, 'COMO FUNCIONA · HIDRELÉTRICA', [{ t: .12, txt: 'A REPRESA' }, { t: T.c2, txt: 'A QUEDA' }, { t: T.c3, txt: 'A TURBINA' }, { t: 6.75, txt: 'O GERADOR' }, { t: T.c4, txt: 'A CIDADE' }]);
LP.legenda(S, [
  { t0: .25, t1: 2.64, txt: 'A represa segura a água do rio.' },
  { t0: 2.86, t1: 5.24, txt: 'Ela desce com força pelo conduto' },
  { t0: 5.45, t1: 7.94, txt: 'e empurra a turbina, que gira o gerador.' },
  { t0: 8.15, t1: 10.96, txt: 'A energia viaja pelos fios e a cidade acende.', fala: 2.0 },
]);
LP.rotulo(S, { alvo: [-2.4, 3.75, -6.5], titulo: 'Reservatório', sub: 'água guardada', t0: .7, t1: 2.66, dx: 50, dy: -120 });
LP.rotulo(S, { alvo: [1.6, 4.45, .3], titulo: 'Barragem', sub: 'segura o rio', t0: 1.35, t1: 2.66, dx: 40, dy: -150 });
LP.rotulo(S, { alvo: [0, 1.45, 1.7], titulo: 'Conduto forçado', sub: 'leva a água pra baixo', t0: 3.55, t1: 5.26, dx: 60, dy: -230 });
LP.cota(S, [0, 3.7, -1.5], [0, .62, -1.5], { t0: 4.05, t1: 5.26, texto: 'queda', lado: -62 });
LP.rotulo(S, { alvo: new THREE.Vector3(59.2, .62, 60.7), titulo: 'Turbina', sub: 'a água gira as pás', t0: 5.75, t1: 7.96, lado: 'esq', dx: 30, dy: -150 });
LP.rotulo(S, { alvo: new THREE.Vector3(60.8, 3.2, 60.45), titulo: 'Gerador', sub: 'ímãs + bobinas', t0: 7.0, t1: 7.96, dx: 70, dy: -40 });
LP.painel(S, [{ t: 5.5, txt: 'Água em queda', val: '1' }, { t: 5.95, txt: 'Turbina girando', val: '2' }, { t: 6.45, txt: 'Eletricidade', val: '3' }], { titulo: 'De onde vem a energia', t0: 5.42, t1: 6.98, top: 430 });
LP.rotulo(S, { alvo: torres[1].localToWorld(new THREE.Vector3(0, 2.75, 0)), titulo: 'Linhas de transmissão', sub: 'levam a energia', t0: 8.3, t1: 9.65, dx: 50, dy: -150 });
LP.carimbo(S, 'ENERGIA DA ÁGUA', { t0: T.carimbo, y: 1290, giro: -5 });

// ════════ som ════════
cue('m:intro', 0); cue('m:drop', T.c3); cue('m:main', T.c4); cue('m:stop', 10.75);
cue('ui_blip', .12); cue('focus_tick', .25);
cue('tick', .7); cue('pop', .72, { f: 900, gain: -8 }); cue('tick', 1.35); cue('pop', 1.37, { f: 1100, gain: -8 });
cue('swoosh', T.c2 - .06); cue('ui_blip', T.c2 + .02, { gain: -3 }); cue('whoosh_slow', T.corte[0], { gain: -2 }); cue('cut', T.corte[1] - .05, { gain: -4 });
cue('agua', T.agua, { d: 2.1 }); cue('tick', 3.55); cue('pop', 3.57, { f: 1000, gain: -8 }); cue('click', 4.05);
cue('whoosh_in', T.c3 - .05); cue('ui_blip', T.c3 + .02, { gain: -3 }); cue('turbina', T.c3 + .05, { d: 2.7 });
cue('tick', 5.5); cue('tick', 5.75); cue('pop', 5.77, { f: 800, gain: -8 }); cue('tick', 5.95); cue('tick', 6.45);
cue('swoosh', T.explode[0] + .05, { gain: -3 }); cue('click', T.explode[1] - .05);
cue('ui_blip', 6.77, { gain: -4 }); cue('zap', T.energia, { gain: -4 }); cue('sparkle', T.energia + .05, { gain: -2 }); cue('tick', 7.0); cue('pop', 7.02, { f: 1000, gain: -8 });

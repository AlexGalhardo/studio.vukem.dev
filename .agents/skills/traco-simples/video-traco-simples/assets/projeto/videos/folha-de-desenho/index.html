<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Folha de desenho: as receitas de references/desenho.md lado a lado + a biblioteca TR.IC.
     Serve para conferir desenhos parados antes de animar:  node render.mjs folha --at=0.5
     Para testar um desenho novo, acrescente uma entrada em RECEITAS. -->
<script>VIDEO={w:1080,h:1920,fps:12,dur:1,bpm:120}</script>
<script src="../../lib/boot.js"></script>
</head><body><div id="stage"></div>
<script>
const P = TR.P, { blob, poly, star, line, G, caixa, gota, olho } = TR;
const S = TR.palco(); TR.ferver(S.art); S.bg.style.background = '#f0ece2';

// cada receita é desenhada em coordenadas locais centradas em (0,0), cabendo em ~±250
const RECEITAS = {
  'gato de frente': () =>
    poly([[-150, -40], [-120, -190], [-40, -120]], P.R) + poly([[-130, -70], [-115, -160], [-70, -115]], P.M)        // orelha esq. + miolo
    + poly([[150, -40], [120, -190], [40, -120]], P.R) + poly([[130, -70], [115, -160], [70, -115]], P.M)             // orelha dir.
    + blob(0, 10, 175, 150, P.R, { j: .03 })                                                                           // cabeça
    + olho(-62, -5, 24) + olho(62, -5, 24) + poly([[-18, 42], [18, 42], [0, 62]], P.M, { j: 1 })                       // olhos + nariz
    + line('M-34 80Q-17 96 0 76Q17 96 34 80', P.k, 8) + line('M-100 50L-185 30', P.k, 7) + line('M-100 72L-180 82', P.k, 7) + line('M100 50L185 30', P.k, 7) + line('M100 72L180 82', P.k, 7),
  'pernas andando': () =>                                                                                              // calça + sapato (como na referência)
    poly([[-88, -60], [-12, -60], [-62, 60], [-138, 50]], P.R) + poly([[-138, 50], [-62, 60], [-52, 175], [-120, 178]], P.R) + blob(-100, 55, 40, 38, P.R)   // perna de apoio
    + blob(-112, 196, 66, 30, P.V, { rot: -4 })                                                                                                                 // sapato
    + poly([[12, -60], [88, -60], [160, 0], [104, 52]], P.R) + poly([[104, 52], [160, 0], [238, 92], [188, 140]], P.R) + blob(132, 26, 40, 38, P.R)        // perna chutando
    + blob(228, 136, 64, 30, P.V, { rot: 42 }) + caixa(-100, -110, 200, 64, 16, P.R) + line('M0 -50L0 0', P.k, 7),                                       // sapato + cós
  'notebook': () =>
    poly([[-170, -150], [190, -150], [150, 30], [-210, 30]], P.k) + caixa(-20, -80, 40, 34, 6, P.G, { j: 2 })          // tela (preta) + ícone
    + poly([[-210, 30], [150, 30], [200, 170], [-160, 170]], P.V) + poly([[-60, 90], [60, 90], [70, 140], [-50, 140]], P.L, { j: 2 }),  // base + trackpad
  'pasta': () =>
    poly([[-186, -110], [-60, -110], [-30, -80], [184, -80], [184, 110], [-184, 110]], P.G)                             // fundo com aba
    + poly([[-150, -150], [140, -165], [150, 60], [-140, 70]], P.W) + caixa(-196, -36, 392, 190, 14, P.G)              // papel saindo + frente (mais larga: cobre o fundo)
    + blob(0, 58, 70, 42, P.V, { n: 10 }),
  'relógio': () =>
    caixa(-150, -150, 300, 300, 70, P.L, { j: 4 }) + blob(0, 0, 26, 26, P.k, { n: 9 })
    + `<g transform="rotate(-35)">${caixa(-14, -110, 28, 110, 10, P.M, { j: 2 })}</g>` + `<g transform="rotate(70)">${caixa(-14, -80, 28, 80, 10, P.G, { j: 2 })}</g>`,
  'globo com pinos': () =>
    blob(0, 0, 170, 160, P.V, { j: .04 }) + blob(-50, -40, 80, 60, P.G, { rot: -20 }) + blob(80, 60, 60, 45, P.G, { rot: 15 }) + blob(-90, 90, 40, 26, P.G)
    + gota(60, -90, 42, P.R) + blob(60, -92, 13, 13, P.k, { n: 7 }) + gota(-70, 20, 36, P.R) + blob(-70, 18, 11, 11, P.k, { n: 7 }),
  'gema facetada': () =>
    poly([[-200, -50], [-120, -130], [120, -130], [200, -50], [0, 150]], P.V) + poly([[-120, -130], [-40, -130], [-80, -50]], P.M)
    + poly([[40, -130], [120, -130], [80, -50]], P.M) + poly([[-80, -50], [80, -50], [0, 150]], P.M) + blob(-130, -70, 22, 9, P.W, { n: 7, rot: -35 }),
  'mascote': () =>
    blob(-132, 34, 52, 94, P.k, { rot: 22 }) + blob(132, 34, 52, 94, P.k, { rot: -22 }) + blob(0, 0, 132, 114, P.k, { j: .03 }) + blob(0, 64, 66, 46, P.k)
    + [-50, 50].map(x => `<g transform="translate(${x} -14)">${blob(0, 0, 36, 33, P.W, { n: 10 })}${blob(0, -6, 16, 16, P.k, { n: 8 })}<rect x="-44" y="-42" width="88" height="20" fill="${P.k}"/></g>`).join('')
    + blob(0, 112, 20, 26, P.M, { n: 9 }),
  'flor': () =>
    line('M0 40C-10 120 10 170 0 230', P.G, 16) + blob(-50, 160, 50, 22, P.G, { rot: -30 })
    + [0, 1, 2, 3, 4, 5].map(i => { const a = i / 6 * Math.PI * 2; return blob(Math.cos(a) * 80, Math.sin(a) * 80 - 40, 60, 42, P.M, { rot: a * 180 / Math.PI }); }).join('') + blob(0, -40, 50, 50, P.L, { n: 10 }),
};
const nomes = Object.keys(RECEITAS), CW = 360, CH = 400;
let html = nomes.map((n, i) => `<g transform="translate(${180 + (i % 3) * CW} ${210 + Math.floor(i / 3) * CH}) scale(.62)">${RECEITAS[n]()}</g>`).join('');
// biblioteca de ícones (TR.IC), em grade menor embaixo
const ic = Object.keys(TR.IC), cores = [[P.R, P.V, P.L], [P.G, P.M, P.W], [P.V, P.L, P.R], [P.M, P.L, P.G]];
html += ic.map((n, i) => `<g transform="translate(${110 + (i % 6) * 172} ${1360 + Math.floor(i / 6) * 150}) scale(.85)">${TR.IC[n](cores[i % 4])}</g>`).join('');
S.svg.innerHTML = html;
K.html(S.labs, `<div style="position:absolute;left:0;right:0;top:0;font:500 22px 'Inter Tight';color:#555">${nomes.map((n, i) => `<span style="position:absolute;left:${(i % 3) * CW}px;width:${CW}px;top:${370 + Math.floor(i / 3) * CH}px;text-align:center">${n}</span>`).join('')}${ic.map((n, i) => `<span style="position:absolute;left:${110 + (i % 6) * 172 - 80}px;width:160px;top:${1360 + Math.floor(i / 6) * 150 + 70}px;text-align:center;font-size:18px">${n}</span>`).join('')}</div>`);
</script></body></html>
